<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ශ්‍රී මිහිඳු දහම් පාසල</title>
    <style>
        body {
            font-family: 'Malithi Web', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fffdf2;
            text-align: center;
        }
        
        /* Header එකේ සහ Logo එකේ හැඩතල */
        header {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: white;
            padding: 25px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 5px solid #d35400;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Logo එක සහ නම අතර පරතරය */
            flex-wrap: wrap; /* ජංගම දුරකථන වලදී ලස්සනට පෙනීමට */
        }
        .logo {
            width: 100px; /* ලෝගෝ එකේ ප්‍රමාණය (අවශ්‍ය නම් වෙනස් කරන්න) */
            height: auto;
            border-radius: 50%; /* ලෝගෝ එක රවුම් හැඩයක් ගැනීමට */
            border: 3px solid white; /* ලෝගෝ එක වටා සුදු පාට ඉරක් */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .header-text {
            text-align: left;
        }
        h1 { margin: 0; font-size: 2.8em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header-text p { margin: 5px 0 0 0; font-size: 1.2em; font-weight: bold; }
        
        /* අනිත් හැඩතල (කලින් ඒවාමයි) */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }
        .welcome-text {
            color: #d35400;
            margin-bottom: 30px;
        }
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .class-card {
            background: white;
            border: 2px solid #ffc107;
            border-radius: 12px;
            padding: 25px;
            text-decoration: none;
            color: #333;
            font-size: 1.4em;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .class-card:hover {
            background: #ffc107;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 193, 7, 0.4);
        }
        footer {
            background-color: #3e2723;
            color: #ffc107;
            padding: 15px;
            margin-top: 40px;
        }

        /* Mobile Phone සඳහා විශේෂ හැඩතල */
        @media (max-width: 600px) {
            .header-text { text-align: center; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

    <!-- ලෝගෝව සහිත නව Header එක -->
    <header>
        <div class="header-content">
            <!-- ඔබගේ ලෝගෝ එකේ නම logo.png නොවේ නම්, පහත තැන අදාළ නම දෙන්න -->
            <img src="images/logo.png.jpeg" alt="දහම් පාසල් ලෝගෝව" class="logo">
            
            <div class="header-text">
                <h1>ශ්‍රී මිහිඳු දහම් පාසල</h1>
                <p>ගුණ නැණ බෙලෙන් යුතු පරපුරක් දැයට දායාද කරමු</p>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="welcome-text">පන්ති නිබන්ධන (Notes) ලබා ගැනීම සඳහා අදාළ ශ්‍රේණිය තෝරන්න</h2>
        
        <div class="classes-grid">
            <a href="grade1.html" class="class-card">1 ශ්‍රේණිය</a>
            <a href="grade2.html" class="class-card">2 ශ්‍රේණිය</a>
            <a href="grade3.html" class="class-card">3 ශ්‍රේණිය</a>
            <a href="grade4.html" class="class-card">4 ශ්‍රේණිය</a>
            <a href="grade5.html" class="class-card">5 ශ්‍රේණිය</a>
            <a href="grade6.html" class="class-card">6 ශ්‍රේණිය</a>
            <a href="grade7.html" class="class-card">7 ශ්‍රේණිය</a>
            <a href="grade8.html" class="class-card">8 ශ්‍රේණිය</a>
            <a href="grade9.html" class="class-card">9 ශ්‍රේණිය</a>
            <a href="grade10.html" class="class-card">10 ශ්‍රේණිය</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ශ්‍රී මිහිඳු දහම් පාසල. සියලු හිමිකම් ඇවිරිණි.</p>
    </footer>

</body>
</html>
